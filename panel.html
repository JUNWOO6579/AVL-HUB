<!DOCTYPE html>
<html lang="ko" class="notranslate" translate="no">
<head><style>* { cursor: none !important; } html, body { cursor: none !important; } button, a, div { cursor: none !important; }</style>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamDeck Touch Panel</title>
    <style>
        * {
            box-sizing: border-box !important;
            user-select: none !important;
            -webkit-user-select: none !important;
            -webkit-touch-callout: none !important;
        }

        html, body {
            width: 100vw !important;
            height: 100vh !important;
            margin: 0 !important;
            padding: 0 !important;
            background: #0d0e12 !important;
            overflow: hidden !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        }

        /* 3열 2행 그리드 여백 최적화 */
        #deck-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            grid-template-rows: repeat(2, 1fr) !important;
            gap: 16px !important;
            width: 100vw !important;
            height: 100vh !important;
            padding: 16px !important;
        }

        /* 버튼 폰트 및 패딩 확대 */
        .deck-key {
            width: 100% !important;
            height: 100% !important;
            margin: 0 !important;
            background: #161b22 !important;
            border: 2px solid #30363d !important;
            border-radius: 18px !important;
            color: #f0f6fc !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            text-align: center !important;
            padding: 12px !important;
            font-size: 22px !important;       /* 14px -> 22px 로 대폭 확대 */
            font-weight: 700 !important;
            transition: transform 0.08s ease, background 0.08s ease, border-color 0.08s ease !important;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4) !important;
        }

        /* 터치/클릭 활성화 피드백 */
        .deck-key:active, .deck-key.active {
            background: #1f6feb !important;
            border-color: #58a6ff !important;
            transform: scale(0.95) !important;
            box-shadow: 0 0 20px rgba(31, 111, 235, 0.7) !important;
        }

        /* 이모지 / 아이콘 크기 확대 */
        .key-icon { 
            font-size: 48px !important;       /* 28px -> 48px 로 대폭 확대 */
            margin-bottom: 10px !important; 
            pointer-events: none !important; 
        }

        /* 버튼 타이틀 가독성 강화 */
        .key-title { 
            pointer-events: none !important; 
            word-break: keep-all !important; 
            line-height: 1.25 !important;
            letter-spacing: -0.5px !important;
        }
* { cursor: none !important; }
html, body { cursor: none !important; }
</style>
</head>
<body style="cursor: none !important;">
    <div id="deck-grid"></div>

    <script src="panel.js"></script>
</body>
</html>
